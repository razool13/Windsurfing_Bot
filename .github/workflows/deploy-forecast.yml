name: Trigger Netlify Build

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push timestamp to trigger Netlify deploy
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > last_updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_updated.txt
          git commit -m "chore: scheduled rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
